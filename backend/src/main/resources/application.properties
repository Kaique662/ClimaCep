spring.application.name=climacep-api
# Spring Boot roda no Windows ou em um servidor. O banco pode ser local ou Supabase.
server.address=0.0.0.0
server.port=${PORT:8080}
spring.datasource.url=${DB_URL:jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:climacep}}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.hikari.maximum-pool-size=${DB_POOL_SIZE:5}
spring.datasource.hikari.minimum-idle=${DB_POOL_MIN_IDLE:1}
spring.datasource.hikari.connection-timeout=${DB_CONNECTION_TIMEOUT:30000}
spring.jpa.open-in-view=false
spring.jpa.hibernate.ddl-auto=validate
spring.flyway.enabled=true
# Obrigatorio: nao deixar segredo JWT fixo no codigo.
app.jwt.secret=${APP_JWT_SECRET}
app.jwt.expiration-hours=12
spring.jackson.time-zone=America/Sao_Paulo
