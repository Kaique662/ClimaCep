spring.application.name=climacep-api
# Spring Boot roda diretamente no Windows. O banco PostgreSQL tambem e local.
server.address=0.0.0.0
server.port=${PORT:8080}
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:climacep}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD}
spring.jpa.open-in-view=false
spring.jpa.hibernate.ddl-auto=validate
spring.flyway.enabled=true
# Obrigatorio: nao deixar segredo JWT fixo no codigo.
app.jwt.secret=${APP_JWT_SECRET}
app.jwt.expiration-hours=12
spring.jackson.time-zone=America/Sao_Paulo
